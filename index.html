<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meu primeiro repositório</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0F172A;
      color: #E2E8F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      background-color: #1E293B;
      padding: 40px;
      border-radius: 12px;
      max-width: 500px;
    }
    h1 { color: #38BDF8; }
    .check { font-size: 60px; }
    p { line-height: 1.6; color: #CBD5E1; }
    .badge {
      display: inline-block;
      background-color: #10B981;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="check">✅</div>
    <h1>Funcionou!</h1>
    <p>Se você está vendo essa página no navegador <strong>E</strong> esse arquivo está num repositório no GitHub, parabéns: <strong>seu setup está completo!</strong></p>
    <div class="badge">Vava38 — Dev em formação</div>
  </div>
</body>
</html>
